<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensa Settimanale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    .tab-active { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: 600; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans pb-12">

  <!-- Header -->
  <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
    <div class="max-w-3xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <svg class="w-6 h-6 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
        <h1 class="text-xl font-bold">Mensa Settimanale</h1>
      </div>
      <button onclick="toggleApiKeyModal()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-lg text-slate-300">
        🔑 API Key
      </button>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-3xl mx-auto p-4 space-y-6">

    <!-- Step 1: Input Menu -->
    <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-slate-900 flex items-center gap-2">
          <span class="bg-blue-100 text-blue-700 rounded-full w-7 h-7 flex items-center justify-center text-sm">1</span>
          Menu dello Chef
        </h2>
        <button onclick="enableManualEdit()" class="text-xs text-blue-600 hover:underline">✏️ Modifica Manuale</button>
      </div>

      <!-- Tabs Input -->
      <div class="flex border-b border-slate-200 mb-4 text-sm">
        <button id="tab-text" onclick="switchInputTab('text')" class="flex-1 py-2 text-center tab-active">Testo Incollato</button>
        <button id="tab-file" onclick="switchInputTab('file')" class="flex-1 py-2 text-center text-slate-500">Foto / PDF</button>
      </div>

      <!-- Input Testo -->
      <div id="input-text-container" class="space-y-3">
        <textarea id="menu-text-input" rows="5" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="Incolla qui il testo del menu inviato dallo chef..."></textarea>
      </div>

      <!-- Input File -->
      <div id="input-file-container" class="space-y-3 hidden">
        <div class="border-2 border-dashed border-slate-300 rounded-xl p-6 text-center bg-slate-50">
          <input type="file" id="menu-file-input" accept="image/*,.pdf" class="hidden" onchange="handleFileSelect(event)">
          <label for="menu-file-input" class="cursor-pointer flex flex-col items-center justify-center space-y-2">
            <svg class="w-8 h-8 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
            <span class="text-sm font-medium text-slate-600" id="file-label">Carica un'immagine o un file PDF</span>
          </label>
        </div>
      </div>

      <button id="btn-parse" onclick="processMenu()" class="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2">
        <span>Elabora Menu con AI</span>
      </button>
    </section>

    <!-- Step 2: Selezione Piatti per Collega -->
    <section id="colleagues-section" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hidden">
      <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
        <span class="bg-blue-100 text-blue-700 rounded-full w-7 h-7 flex items-center justify-center text-sm">2</span>
        Scelta Piatti per Collega
      </h2>

      <!-- Selettore Collega -->
      <div class="flex bg-slate-100 p-1 rounded-xl mb-4 text-sm font-medium">
        <button id="btn-col-elia" onclick="switchColleague('Elia')" class="flex-1 py-2 rounded-lg bg-white shadow-sm text-slate-900 text-center">Elia</button>
        <button id="btn-col-simone" onclick="switchColleague('Simone')" class="flex-1 py-2 rounded-lg text-slate-600 text-center">Simone</button>
        <button id="btn-col-adrian" onclick="switchColleague('Adrian')" class="flex-1 py-2 rounded-lg text-slate-600 text-center">Adrian</button>
      </div>

      <!-- Presenza Collega -->
      <div class="flex items-center justify-between p-3 bg-slate-50 rounded-xl mb-4 border border-slate-200">
        <span class="text-sm font-semibold text-slate-700" id="presence-label">Presenza di Elia questa settimana:</span>
        <label class="relative inline-flex items-center cursor-pointer">
          <input type="checkbox" id="presence-toggle" class="sr-only peer" checked onchange="togglePresence()">
          <div class="w-11 h-6 bg-slate-300 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
        </label>
      </div>

      <!-- Form Piatti Giornalieri -->
      <div id="days-container" class="space-y-6"></div>
    </section>

    <!-- Step 3: Riepilogo e Inoltro Chef -->
    <section id="summary-section" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 hidden">
      <h2 class="text-lg font-bold text-slate-900 mb-4 flex items-center gap-2">
        <span class="bg-blue-100 text-blue-700 rounded-full w-7 h-7 flex items-center justify-center text-sm">3</span>
        Riepilogo Totali da Inviare allo Chef
      </h2>

      <div id="summary-content" class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-sm font-mono whitespace-pre-wrap mb-4 text-slate-800"></div>

      <button onclick="sendToWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 rounded-xl transition flex items-center justify-center gap-2">
        <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981z"/></svg>
        <span>Invia Ordinazione su WhatsApp</span>
      </button>
    </section>
  </main>

  <!-- Modal API Key -->
  <div id="api-key-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl">
      <h3 class="text-lg font-bold text-slate-900">Configura Chiave API Gemini</h3>
      <p class="text-xs text-slate-600">Inserisci la tua API Key ottenuta gratuitamente da Google AI Studio per permettere all'app di interpretare testo, foto e PDF.</p>
      <input type="password" id="api-key-input" class="w-full p-3 border border-slate-300 rounded-xl text-sm focus:ring-2 focus:ring-blue-500 focus:outline-none" placeholder="AIzaSy...">
      <div class="flex justify-end gap-2">
        <button onclick="toggleApiKeyModal()" class="px-4 py-2 text-sm text-slate-600 hover:bg-slate-100 rounded-lg">Annulla</button>
        <button onclick="saveApiKey()" class="px-4 py-2 text-sm bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700">Salva Chiave</button>
      </div>
    </div>
  </div>

  <script>
    // Configurazione e Stato App
    const DAYS = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì'];
    const COLLEAGUES = ['Elia', 'Simone', 'Adrian'];
    let activeTab = 'text';
    let currentColleague = 'Elia';
    let fileBase64 = null;
    let fileMimeType = null;

    let menuData = {
      Lunedì: { primi: [], secondi: [] },
      Martedì: { primi: [], secondi: [] },
      Mercoledì: { primi: [], secondi: [] },
      Giovedì: { primi: [], secondi: [] },
      Venerdì: { primi: [], secondi: [] }
    };

    let selections = {
      Elia: { active: true, choices: {} },
      Simone: { active: true, choices: {} },
      Adrian: { active: true, choices: {} }
    };

    DAYS.forEach(day => {
      COLLEAGUES.forEach(col => {
        if (!selections[col].choices[day]) {
          selections[col].choices[day] = { primo: '', secondo: '' };
        }
      });
    });

    window.onload = () => {
      const savedKey = localStorage.getItem('gemini_api_key');
      if (!savedKey) toggleApiKeyModal();
    };

    function toggleApiKeyModal() {
      const modal = document.getElementById('api-key-modal');
      const input = document.getElementById('api-key-input');
      input.value = localStorage.getItem('gemini_api_key') || '';
      modal.classList.toggle('hidden');
    }

    function saveApiKey() {
      const key = document.getElementById('api-key-input').value.trim();
      if (key) {
        localStorage.setItem('gemini_api_key', key);
        toggleApiKeyModal();
      }
    }

    function switchInputTab(tab) {
      activeTab = tab;
      document.getElementById('tab-text').className = tab === 'text' ? 'flex-1 py-2 text-center tab-active' : 'flex-1 py-2 text-center text-slate-500';
      document.getElementById('tab-file').className = tab === 'file' ? 'flex-1 py-2 text-center tab-active' : 'flex-1 py-2 text-center text-slate-500';
      document.getElementById('input-text-container').classList.toggle('hidden', tab !== 'text');
      document.getElementById('input-file-container').classList.toggle('hidden', tab !== 'file');
    }

    async function handleFileSelect(event) {
      const file = event.target.files[0];
      if (!file) return;
      document.getElementById('file-label').innerText = file.name;

      if (file.type === 'application/pdf') {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let fullText = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const textContent = await page.getTextContent();
          fullText += textContent.items.map(item => item.str).join(' ') + '\n';
        }
        document.getElementById('menu-text-input').value = fullText;
        switchInputTab('text');
      } else {
        const reader = new FileReader();
        reader.onload = function(e) {
          const base64String = e.target.result.split(',')[1];
          fileBase64 = base64String;
          fileMimeType = file.type;
        };
        reader.readAsDataURL(file);
      }
    }

    async function processMenu() {
      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        alert("Inserisci prima la tua API Key Gemini dal pulsante in alto.");
        toggleApiKeyModal();
        return;
      }

      const btn = document.getElementById('btn-parse');
      btn.disabled = true;
      btn.innerText = "Analisi in corso con AI...";

      try {
        let responseText = "";
        const prompt = `Estrai il menu settimanale (da Lunedì a Venerdì) per una mensa. Per ciascun giorno individua esattamente i 2 primi e i 2 secondi disponibili. Rispondi ESCLUSIVAMENTE con un oggetto JSON valido senza formattazione markdown aggiuntiva con la seguente struttura:
{
  "Lunedì": {"primi": ["Primo 1", "Primo 2"], "secondi": ["Secondo 1", "Secondo 2"]},
  "Martedì": {"primi": ["Primo 1", "Primo 2"], "secondi": ["Secondo 1", "Secondo 2"]},
  "Mercoledì": {"primi": ["Primo 1", "Primo 2"], "secondi": ["Secondo 1", "Secondo 2"]},
  "Giovedì": {"primi": ["Primo 1", "Primo 2"], "secondi": ["Secondo 1", "Secondo 2"]},
  "Venerdì": {"primi": ["Primo 1", "Primo 2"], "secondi": ["Secondo 1", "Secondo 2"]}
}`;

        // Endpoint aggiornato per Gemini 2.5 Flash
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;

        let payload = {};
        if (activeTab === 'text' || document.getElementById('menu-text-input').value.trim() !== '') {
          const textContent = document.getElementById('menu-text-input').value;
          payload = { contents: [{ parts: [{ text: prompt + "\n\nEcco il menu:\n" + textContent }] }] };
        } else if (activeTab === 'file' && fileBase64) {
          payload = {
            contents: [{
              parts: [
                { text: prompt },
                { inline_data: { mime_type: fileMimeType, data: fileBase64 } }
              ]
            }]
          };
        } else {
          alert("Inserisci un testo o carica un file.");
          btn.disabled = false;
          btn.innerText = "Elabora Menu con AI";
          return;
        }

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const errData = await res.json();
          throw new Error(errData.error?.message || "Errore durante la chiamata API");
        }

        const data = await res.json();
        const rawJson = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
        menuData = JSON.parse(rawJson);

        renderSelectionForms();
        document.getElementById('colleagues-section').classList.remove('hidden');
        document.getElementById('summary-section').classList.remove('hidden');
        updateSummary();

      } catch (err) {
        alert("Errore nell'elaborazione: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Elabora Menu con AI";
      }
    }

    function enableManualEdit() {
      menuData = {
        Lunedì: { primi: ["Primo A", "Primo B"], secondi: ["Secondo A", "Secondo B"] },
        Martedì: { primi: ["Primo A", "Primo B"], secondi: ["Secondo A", "Secondo B"] },
        Mercoledì: { primi: ["Primo A", "Primo B"], secondi: ["Secondo A", "Secondo B"] },
        Giovedì: { primi: ["Primo A", "Primo B"], secondi: ["Secondo A", "Secondo B"] },
        Venerdì: { primi: ["Primo A", "Primo B"], secondi: ["Secondo A", "Secondo B"] }
      };
      renderSelectionForms();
      document.getElementById('colleagues-section').classList.remove('hidden');
      document.getElementById('summary-section').classList.remove('hidden');
      updateSummary();
    }

    function switchColleague(colleague) {
      currentColleague = colleague;
      COLLEAGUES.forEach(c => {
        const btn = document.getElementById(`btn-col-${c.toLowerCase()}`);
        if (c === colleague) {
          btn.className = 'flex-1 py-2 rounded-lg bg-white shadow-sm text-slate-900 text-center font-bold';
        } else {
          btn.className = 'flex-1 py-2 rounded-lg text-slate-600 text-center';
        }
      });
      document.getElementById('presence-label').innerText = `Presenza di ${colleague} questa settimana:`;
      document.getElementById('presence-toggle').checked = selections[colleague].active;
      renderSelectionForms();
    }

    function togglePresence() {
      const isChecked = document.getElementById('presence-toggle').checked;
      selections[currentColleague].active = isChecked;
      renderSelectionForms();
      updateSummary();
    }

    function renderSelectionForms() {
      const container = document.getElementById('days-container');
      container.innerHTML = '';

      if (!selections[currentColleague].active) {
        container.innerHTML = `<div class="p-4 bg-amber-50 border border-amber-200 text-amber-800 rounded-xl text-sm text-center">
          ${currentColleague} è segnato come ASSENTE questa settimana.
        </div>`;
        return;
      }

      DAYS.forEach(day => {
        const dayData = menuData[day] || { primi: [], secondi: [] };
        const userChoice = selections[currentColleague].choices[day];

        const dayCard = document.createElement('div');
        dayCard.className = 'p-4 border border-slate-200 rounded-xl bg-slate-50 space-y-3';
        dayCard.innerHTML = `
          <h3 class="font-bold text-slate-800 border-b border-slate-200 pb-2 flex items-center justify-between">
            <span>📅 ${day.toUpperCase()}</span>
          </h3>
          
          <div>
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Primo piatto:</span>
            <div class="space-y-1">
              ${dayData.primi.map(primo => `
                <label class="flex items-center space-x-2 p-2 rounded-lg bg-white border border-slate-200 text-sm cursor-pointer">
                  <input type="radio" name="${currentColleague}-${day}-primo" value="${primo}" ${userChoice.primo === primo ? 'checked' : ''} onchange="saveChoice('${day}', 'primo', '${primo.replace(/'/g, "\\'")}')" class="text-blue-600 focus:ring-blue-500">
                  <span class="text-slate-700">${primo}</span>
                </label>
              `).join('')}
            </div>
          </div>

          <div>
            <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider block mb-1">Secondo piatto:</span>
            <div class="space-y-1">
              ${dayData.secondi.map(secondo => `
                <label class="flex items-center space-x-2 p-2 rounded-lg bg-white border border-slate-200 text-sm cursor-pointer">
                  <input type="radio" name="${currentColleague}-${day}-secondo" value="${secondo}" ${userChoice.secondo === secondo ? 'checked' : ''} onchange="saveChoice('${day}', 'secondo', '${secondo.replace(/'/g, "\\'")}')" class="text-blue-600 focus:ring-blue-500">
                  <span class="text-slate-700">${secondo}</span>
                </label>
              `).join('')}
            </div>
          </div>
        `;
        container.appendChild(dayCard);
      });
    }

    function saveChoice(day, course, value) {
      selections[currentColleague].choices[day][course] = value;
      updateSummary();
    }

    function updateSummary() {
      let text = "📋 *ORDINAZIONE MENSA SETTIMANALE*\n\n";

      DAYS.forEach(day => {
        let primiCounts = {};
        let secondiCounts = {};

        COLLEAGUES.forEach(col => {
          if (selections[col].active) {
            const p = selections[col].choices[day].primo;
            const s = selections[col].choices[day].secondo;
            if (p) primiCounts[p] = (primiCounts[p] || 0) + 1;
            if (s) secondiCounts[s] = (secondiCounts[s] || 0) + 1;
          }
        });

        text += `*${day.toUpperCase()}*\n`;
        text += " Primi:\n";
        if (Object.keys(primiCounts).length === 0) text += "  - Nessuna scelta\n";
        for (const [dish, count] of Object.entries(primiCounts)) {
          text += `  • ${count}x ${dish}\n`;
        }

        text += " Secondi:\n";
        if (Object.keys(secondiCounts).length === 0) text += "  - Nessuna scelta\n";
        for (const [dish, count] of Object.entries(secondiCounts)) {
          text += `  • ${count}x ${dish}\n`;
        }
        text += "\n";
      });

      document.getElementById('summary-content').innerText = text;
    }

    function sendToWhatsApp() {
      const text = document.getElementById('summary-content').innerText;
      const encodedText = encodeURIComponent(text);
      window.open(`https://wa.me/?text=${encodedText}`, '_blank');
    }
  </script>
</body>
</html>
