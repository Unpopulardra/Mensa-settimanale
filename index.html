<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensa Settimanale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- Configurazione PWA -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mensa">
  
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrato:', reg))
          .catch(err => console.error('Errore SW:', err));
      });
    }

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-16">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
          🍴
        </div>
        <div>
          <h1 class="font-bold text-slate-100 text-base leading-tight">Mensa Settimanale</h1>
          <p class="text-xs text-slate-400">Elia • Simone • Adrian</p>
        </div>
      </div>
      <div id="sync-status" class="px-2.5 py-1 bg-amber-950/60 text-amber-400 text-[11px] font-semibold rounded-lg border border-amber-800/50 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Connessione...
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6 space-y-6">

    <!-- Passaggio 1: Input Menu -->
    <section class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-4">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-blue-600/20 text-blue-400 text-xs font-bold flex items-center justify-center border border-blue-500/30">1</span>
          <h2 class="font-bold text-sm text-slate-200">Carica Menu dello Chef</h2>
        </div>
        <button onclick="enableManualEdit()" class="text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1">
          ✏️ Compila Manuale
        </button>
      </div>

      <!-- Tab Selettore Input -->
      <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-medium">
        <button id="tab-text" onclick="switchTab('text')" class="flex-1 py-2 rounded-lg bg-slate-800 text-blue-400 font-bold shadow-sm">Testo Incollato</button>
        <button id="tab-file" onclick="switchTab('file')" class="flex-1 py-2 rounded-lg text-slate-400">PDF / Documenti</button>
      </div>

      <!-- Area Testo -->
      <div id="container-text">
        <textarea id="menu-text" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-blue-500 font-mono" placeholder="Incolla qui il messaggio del menu inviato dallo chef..."></textarea>
      </div>

      <!-- Area File -->
      <div id="container-file" class="hidden">
        <label for="menu-file" class="border-2 border-dashed border-slate-800 hover:border-slate-700 bg-slate-950 rounded-xl p-6 text-center block cursor-pointer">
          <input type="file" id="menu-file" accept=".pdf,text/*" class="hidden" onchange="handleFileUpload(event)">
          <span class="text-2xl block mb-1">📄</span>
          <span id="file-label-text" class="text-xs text-slate-400 block">Tocca per selezionare un file PDF o Testo</span>
        </label>
      </div>

      <button id="btn-process" onclick="parseMenuTextLocal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
        ⚡ Estrai e Sincronizza Menu
      </button>
    </section>

    <!-- Editor Manuale / Anteprima Menu -->
    <section id="section-menu-editor" class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">📋 Menu della Settimana (Condiviso)</h3>
        <span class="text-[10px] text-slate-500">2 Primi e 2 Secondi</span>
      </div>

      <div id="editor-days-container" class="space-y-4"></div>
    </section>

    <!-- Passaggio 2: Scelte Collega -->
    <section id="section-selection" class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-4">
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded-full bg-blue-600/20 text-blue-400 text-xs font-bold flex items-center justify-center border border-blue-500/30">2</span>
        <h2 class="font-bold text-sm text-slate-200">Seleziona i Piatti per i Colleghi</h2>
      </div>

      <!-- Selettore Persona -->
      <div class="grid grid-cols-3 gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
        <button id="btn-user-Elia" onclick="setActiveUser('Elia')" class="py-2 rounded-lg bg-blue-600 text-white">Elia</button>
        <button id="btn-user-Simone" onclick="setActiveUser('Simone')" class="py-2 rounded-lg text-slate-400">Simone</button>
        <button id="btn-user-Adrian" onclick="setActiveUser('Adrian')" class="py-2 rounded-lg text-slate-400">Adrian</button>
      </div>

      <!-- Form Opzioni Giornaliere con Presenza Giornaliera -->
      <div id="selection-forms-container" class="space-y-4"></div>

      <!-- Pulsanti Salva nello Storico -->
      <div class="pt-2 grid grid-cols-1 gap-2">
        <button onclick="saveUserToHistory()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
          💾 Salva la Settimana di <span id="btn-save-name" class="font-bold underline">Elia</span> nello Storico
        </button>
      </div>
    </section>

    <!-- Passaggio 3: Riepilogo e WhatsApp Chef -->
    <section id="section-summary" class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-4">
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded-full bg-blue-600/20 text-blue-400 text-xs font-bold flex items-center justify-center border border-blue-500/30">3</span>
        <h2 class="font-bold text-sm text-slate-200">Totali da Inviare allo Chef</h2>
      </div>

      <div id="summary-text-box" class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono whitespace-pre-wrap text-slate-300 leading-relaxed"></div>

      <button onclick="shareWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl text-xs transition flex items-center justify-center gap-2">
        💬 Invia Totali allo Chef su WhatsApp
      </button>
    </section>

    <!-- Sezione Storico Ordinazioni -->
    <section id="section-history" class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <span class="text-base">📜</span>
          <h2 class="font-bold text-sm text-slate-200">Storico Ordinazioni (Ultimo Mese)</h2>
        </div>
        <span class="text-[10px] text-slate-500">Max 4 settimane</span>
      </div>

      <div id="history-container" class="space-y-3">
        <p class="text-xs text-slate-500 italic text-center py-2">Nessun ordine nello storico.</p>
      </div>
    </section>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB0Tj6UNisnUnvkpkVzX2oQLue3Y9liILk",
      authDomain: "mensa-aziendale-961a3.firebaseapp.com",
      projectId: "mensa-aziendale-961a3",
      storageBucket: "mensa-aziendale-961a3.firebasestorage.app",
      messagingSenderId: "941882269951",
      appId: "1:941882269951:web:f623f67d427da6899f6cca",
      databaseURL: "https://mensa-aziendale-961a3-default-rtdb.europe-west1.firebasedatabase.app"
    };

    const DAYS = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì'];
    const USERS = ['Elia', 'Simone', 'Adrian'];

    let activeTab = 'text';
    let activeUser = 'Elia';
    let db = null;

    let menuState = {
      'Lunedì': { p1: '', p2: '', s1: '', s2: '' },
      'Martedì': { p1: '', p2: '', s1: '', s2: '' },
      'Mercoledì': { p1: '', p2: '', s1: '', s2: '' },
      'Giovedì': { p1: '', p2: '', s1: '', s2: '' },
      'Venerdì': { p1: '', p2: '', s1: '', s2: '' }
    };

    let userSelections = {
      Elia: { presence: { Lunedì: true, Martedì: true, Mercoledì: true, Giovedì: true, Venerdì: true }, choices: {} },
      Simone: { presence: { Lunedì: true, Martedì: true, Mercoledì: true, Giovedì: true, Venerdì: true }, choices: {} },
      Adrian: { presence: { Lunedì: true, Martedì: true, Mercoledì: true, Giovedì: true, Venerdì: true }, choices: {} }
    };

    let historyData = [];

    DAYS.forEach(d => {
      USERS.forEach(u => {
        userSelections[u].choices[d] = { primo: '', secondo: '' };
      });
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderEditor();
      renderSelections();
      updateSummaryUIOnly();
      renderHistory();
      initFirebaseSync();
    });

    function initFirebaseSync() {
      const statusEl = document.getElementById('sync-status');
      
      try {
        if (!firebase.apps.length) {
          firebase.initializeApp(firebaseConfig);
        }
        db = firebase.database();

        db.ref('mensa_data').on('value', snapshot => {
          const data = snapshot.val();
          if (data) {
            if (data.menuState) menuState = data.menuState;
            if (data.userSelections) {
              USERS.forEach(u => {
                if (data.userSelections[u]) {
                  if (!data.userSelections[u].presence) {
                    const oldActive = data.userSelections[u].active !== false;
                    data.userSelections[u].presence = { Lunedì: oldActive, Martedì: oldActive, Mercoledì: oldActive, Giovedì: oldActive, Venerdì: oldActive };
                  }
                  userSelections[u] = data.userSelections[u];
                }
              });
            }
            if (data.historyData) historyData = data.historyData;
            
            renderEditor();
            renderSelections();
            updateSummaryUIOnly();
            renderHistory();
          }

          statusEl.className = 'px-2.5 py-1 bg-emerald-950/60 text-emerald-400 text-[11px] font-semibold rounded-lg border border-emerald-800/50 flex items-center gap-1.5';
          statusEl.innerHTML = '<span class="w-2 h-2 rounded-full bg-emerald-400"></span> Online / Sincronizzato';
        }, err => {
          console.warn("Errore Firebase:", err);
          statusEl.className = 'px-2.5 py-1 bg-slate-800 text-slate-300 text-[11px] font-semibold rounded-lg border border-slate-700 flex items-center gap-1.5';
          statusEl.innerHTML = '⚡ Locale';
        });
      } catch (e) {
        console.warn("Eccezione inizializzazione Firebase:", e);
        statusEl.className = 'px-2.5 py-1 bg-slate-800 text-slate-300 text-[11px] font-semibold rounded-lg border border-slate-700 flex items-center gap-1.5';
        statusEl.innerHTML = '⚡ Locale';
      }
    }

    function pushDataToFirebase() {
      renderEditor();
      renderSelections();
      updateSummaryUIOnly();
      renderHistory();

      if (db) {
        db.ref('mensa_data').set({
          menuState: menuState,
          userSelections: userSelections,
          historyData: historyData
        }).catch(err => console.warn("Errore scrittura DB:", err));
      }
    }

    function switchTab(tab) {
      activeTab = tab;
      document.getElementById('tab-text').className = tab === 'text' ? 'flex-1 py-2 rounded-lg bg-slate-800 text-blue-400 font-bold shadow-sm' : 'flex-1 py-2 rounded-lg text-slate-400';
      document.getElementById('tab-file').className = tab === 'file' ? 'flex-1 py-2 rounded-lg bg-slate-800 text-blue-400 font-bold shadow-sm' : 'flex-1 py-2 rounded-lg text-slate-400';
      document.getElementById('container-text').classList.toggle('hidden', tab !== 'text');
      document.getElementById('container-file').classList.toggle('hidden', tab !== 'file');
    }

    async function handleFileUpload(e) {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('file-label-text').innerText = file.name;

      if (file.type === 'application/pdf') {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
        let txt = '';
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const content = await page.getTextContent();
          txt += content.items.map(item => item.str).join(' ') + '\n';
        }
        document.getElementById('menu-text').value = txt;
        switchTab('text');
      } else if (file.type.startsWith('text/')) {
        const txt = await file.text();
        document.getElementById('menu-text').value = txt;
        switchTab('text');
      }
    }

    function parseMenuTextLocal() {
      const text = document.getElementById('menu-text').value.trim();
      if (!text) {
        alert("Incolla prima il testo del menu nel riquadro.");
        return;
      }

      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      let currentDay = null;
      let dayLines = { 'Lunedì': [], 'Martedì': [], 'Mercoledì': [], 'Giovedì': [], 'Venerdì': [] };

      lines.forEach(line => {
        const lower = line.toLowerCase();
        if (lower.includes('luned')) currentDay = 'Lunedì';
        else if (lower.includes('marted')) currentDay = 'Martedì';
        else if (lower.includes('mercoled')) currentDay = 'Mercoledì';
        else if (lower.includes('gioved')) currentDay = 'Giovedì';
        else if (lower.includes('venerd')) currentDay = 'Venerdì';
        else if (currentDay) {
          dayLines[currentDay].push(line);
        }
      });

      DAYS.forEach(day => {
        const items = dayLines[day];
        if (items.length >= 4) {
          menuState[day] = { p1: items[0], p2: items[1], s1: items[2], s2: items[3] };
        } else if (items.length === 2) {
          menuState[day] = { p1: items[0], p2: '', s1: items[1], s2: '' };
        } else if (items.length > 0) {
          menuState[day] = {
            p1: items[0] || '',
            p2: items[1] || '',
            s1: items[2] || '',
            s2: items[3] || ''
          };
        }
      });

      pushDataToFirebase();
    }

    function enableManualEdit() {
      DAYS.forEach(d => {
        if (!menuState[d].p1) {
          menuState[d] = { p1: 'Primo A', p2: 'Primo B', s1: 'Secondo A', s2: 'Secondo B' };
        }
      });
      pushDataToFirebase();
    }

    function updateMenuField(day, field, val) {
      menuState[day][field] = val;
      pushDataToFirebase();
    }

    function renderEditor() {
      const container = document.getElementById('editor-days-container');
      if (!container) return;
      container.innerHTML = '';

      DAYS.forEach(day => {
        const d = menuState[day] || { p1: '', p2: '', s1: '', s2: '' };
        const card = document.createElement('div');
        card.className = 'p-3 bg-slate-950 rounded-xl border border-slate-800 space-y-2';
        card.innerHTML = `
          <h4 class="text-xs font-bold text-blue-400 mb-2">${day}</h4>
          <div class="grid grid-cols-2 gap-2 text-xs">
            <div>
              <label class="text-[10px] text-slate-500 block mb-0.5">1° Primo</label>
              <input type="text" value="${d.p1.replace(/"/g, '&quot;')}" onchange="updateMenuField('${day}', 'p1', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-blue-500" placeholder="Primo 1">
            </div>
            <div>
              <label class="text-[10px] text-slate-500 block mb-0.5">2° Primo</label>
              <input type="text" value="${d.p2.replace(/"/g, '&quot;')}" onchange="updateMenuField('${day}', 'p2', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-blue-500" placeholder="Primo 2">
            </div>
            <div>
              <label class="text-[10px] text-slate-500 block mb-0.5">1° Secondo</label>
              <input type="text" value="${d.s1.replace(/"/g, '&quot;')}" onchange="updateMenuField('${day}', 's1', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-blue-500" placeholder="Secondo 1">
            </div>
            <div>
              <label class="text-[10px] text-slate-500 block mb-0.5">2° Secondo</label>
              <input type="text" value="${d.s2.replace(/"/g, '&quot;')}" onchange="updateMenuField('${day}', 's2', this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2 text-slate-200 focus:outline-none focus:border-blue-500" placeholder="Secondo 2">
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setActiveUser(user) {
      activeUser = user;
      USERS.forEach(u => {
        const btn = document.getElementById(`btn-user-${u}`);
        if (btn) {
          if (u === user) {
            btn.className = 'py-2 rounded-lg bg-blue-600 text-white shadow-sm';
          } else {
            btn.className = 'py-2 rounded-lg text-slate-400 hover:text-slate-200';
          }
        }
      });

      const btnSaveName = document.getElementById('btn-save-name');
      if (btnSaveName) btnSaveName.innerText = user;
      renderSelections();
    }

    function toggleDailyPresence(day) {
      if (!userSelections[activeUser].presence) {
        userSelections[activeUser].presence = { Lunedì: true, Martedì: true, Mercoledì: true, Giovedì: true, Venerdì: true };
      }
      userSelections[activeUser].presence[day] = !userSelections[activeUser].presence[day];
      pushDataToFirebase();
    }

    function selectUserOption(day, course, value) {
      if (!userSelections[activeUser].choices[day]) {
        userSelections[activeUser].choices[day] = { primo: '', secondo: '' };
      }
      userSelections[activeUser].choices[day][course] = value;
      pushDataToFirebase();
    }

    function renderSelections() {
      const container = document.getElementById('selection-forms-container');
      if (!container) return;
      container.innerHTML = '';

      const userP = (userSelections[activeUser] && userSelections[activeUser].presence) 
        ? userSelections[activeUser].presence 
        : { Lunedì: true, Martedì: true, Mercoledì: true, Giovedì: true, Venerdì: true };

      DAYS.forEach(day => {
        const m = menuState[day] || { p1: '', p2: '', s1: '', s2: '' };
        const userChoice = (userSelections[activeUser] && userSelections[activeUser].choices && userSelections[activeUser].choices[day]) 
          ? userSelections[activeUser].choices[day] 
          : { primo: '', secondo: '' };
        const isPresent = userP[day] !== false;

        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border transition-all ${isPresent ? 'bg-slate-950 border-slate-800 space-y-3' : 'bg-slate-950/40 border-slate-900 opacity-60 space-y-2'}`;

        const primiOptions = [m.p1, m.p2].filter(Boolean);
        const secondiOptions = [m.s1, m.s2].filter(Boolean);

        card.innerHTML = `
          <div class="font-bold text-xs border-b border-slate-800 pb-1.5 flex justify-between items-center">
            <span class="${isPresent ? 'text-slate-200' : 'text-slate-500'}">📅 ${day.toUpperCase()}</span>
            <div class="flex items-center gap-2">
              <span class="text-[10px] ${isPresent ? 'text-emerald-400 font-semibold' : 'text-amber-500 font-semibold'}">${isPresent ? 'Presente' : 'Assente'}</span>
              <label class="relative inline-flex items-center cursor-pointer">
                <input type="checkbox" class="sr-only peer" ${isPresent ? 'checked' : ''} onchange="toggleDailyPresence('${day}')">
                <div class="w-8 h-4 bg-slate-800 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:bg-blue-600"></div>
              </label>
            </div>
          </div>

          ${isPresent ? `
          <!-- Primi -->
          <div>
            <span class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold block mb-1">Primo:</span>
            <div class="space-y-1">
              ${primiOptions.length > 0 ? primiOptions.map(p => `
                <label class="flex items-center space-x-2 p-2 rounded-lg bg-slate-900 border border-slate-800 text-xs cursor-pointer hover:border-slate-700">
                  <input type="radio" name="${activeUser}-${day}-primo" value="${p.replace(/"/g, '&quot;')}" ${userChoice.primo === p ? 'checked' : ''} onchange="selectUserOption('${day}', 'primo', this.value)" class="text-blue-600 focus:ring-0 bg-slate-950 border-slate-700">
                  <span class="text-slate-300">${p}</span>
                </label>
              `).join('') : '<span class="text-xs text-slate-600 italic">Nessun primo inserito</span>'}
            </div>
          </div>

          <!-- Secondi -->
          <div>
            <span class="text-[10px] uppercase tracking-wider text-slate-500 font-semibold block mb-1">Secondo:</span>
            <div class="space-y-1">
              ${secondiOptions.length > 0 ? secondiOptions.map(s => `
                <label class="flex items-center space-x-2 p-2 rounded-lg bg-slate-900 border border-slate-800 text-xs cursor-pointer hover:border-slate-700">
                  <input type="radio" name="${activeUser}-${day}-secondo" value="${s.replace(/"/g, '&quot;')}" ${userChoice.secondo === s ? 'checked' : ''} onchange="selectUserOption('${day}', 'secondo', this.value)" class="text-blue-600 focus:ring-0 bg-slate-950 border-slate-700">
                  <span class="text-slate-300">${s}</span>
                </label>
              `).join('') : '<span class="text-xs text-slate-600 italic">Nessun secondo inserito</span>'}
            </div>
          </div>
          ` : `
            <div class="text-[11px] text-slate-500 italic py-1">Nessun pasto richiesto per ${day}.</div>
          `}
        `;
        container.appendChild(card);
      });
    }

    function updateSummaryUIOnly() {
      const summaryBox = document.getElementById('summary-text-box');
      if (!summaryBox) return;

      let out = "📋 *ORDINAZIONE MENSA SETTIMANALE*\n\n";

      DAYS.forEach(day => {
        let primiCounts = {};
        let secondiCounts = {};

        USERS.forEach(u => {
          const userP = userSelections[u] ? userSelections[u].presence : null;
          const isPresent = userP ? userP[day] !== false : true;

          if (isPresent && userSelections[u] && userSelections[u].choices && userSelections[u].choices[day]) {
            const p = userSelections[u].choices[day].primo;
            const s = userSelections[u].choices[day].secondo;
            if (p) primiCounts[p] = (primiCounts[p] || 0) + 1;
            if (s) secondiCounts[s] = (secondiCounts[s] || 0) + 1;
          }
        });

        out += `*${day.toUpperCase()}*\n`;
        out += " Primi:\n";
        const primiKeys = Object.keys(primiCounts);
        if (primiKeys.length === 0) {
          out += "  - Nessuna scelta\n";
        } else {
          primiKeys.forEach(k => out += `  • ${primiCounts[k]}x ${k}\n`);
        }

        out += " Secondi:\n";
        const secondiKeys = Object.keys(secondiCounts);
        if (secondiKeys.length === 0) {
          out += "  - Nessuna scelta\n";
        } else {
          secondiKeys.forEach(k => out += `  • ${secondiCounts[k]}x ${k}\n`);
        }
        out += "\n";
      });

      summaryBox.innerText = out;
    }

    function saveUserToHistory() {
      const today = new Date();
      const dateString = today.toLocaleDateString('it-IT', { day: '2-digit', month: '2-digit', year: 'numeric' });

      let details = [];
      const userP = (userSelections[activeUser] && userSelections[activeUser].presence) ? userSelections[activeUser].presence : {};

      DAYS.forEach(day => {
        if (userP[day] !== false) {
          const choice = (userSelections[activeUser] && userSelections[activeUser].choices && userSelections[activeUser].choices[day]) 
            ? userSelections[activeUser].choices[day] 
            : { primo: '', secondo: '' };
          details.push({
            day: day,
            primo: choice.primo || 'Non selezionato',
            secondo: choice.secondo || 'Non selezionato'
          });
        } else {
          details.push({
            day: day,
            primo: 'ASSENTE',
            secondo: 'ASSENTE'
          });
        }
      });

      const entry = {
        id: Date.now(),
        user: activeUser,
        date: dateString,
        timestamp: today.getTime(),
        details: details
      };

      historyData = historyData.filter(h => !(h.user === activeUser && h.date === dateString));
      historyData.unshift(entry);

      if (historyData.length > 12) {
        historyData = historyData.slice(0, 12);
      }

      pushDataToFirebase();
      alert(`Settimana di ${activeUser} salvata nello storico con successo!`);
    }

    function deleteHistoryItem(id) {
      if (confirm("Vuoi eliminare questa voce dallo storico?")) {
        historyData = historyData.filter(h => h.id !== id);
        pushDataToFirebase();
      }
    }

    function renderHistory() {
      const container = document.getElementById('history-container');
      if (!container) return;
      container.innerHTML = '';

      if (!historyData || historyData.length === 0) {
        container.innerHTML = '<p class="text-xs text-slate-500 italic text-center py-2">Nessun ordine nello storico.</p>';
        return;
      }

      historyData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'p-3 bg-slate-950 rounded-xl border border-slate-800 text-xs space-y-2';

        let rows = item.details.map(d => `
          <div class="flex justify-between items-start text-[11px] py-0.5 border-b border-slate-900/60 last:border-0">
            <span class="font-semibold text-slate-400 w-16">${d.day.slice(0, 3)}:</span>
            <span class="text-slate-300 text-right flex-1">${d.primo === 'ASSENTE' ? '<span class="text-amber-500 font-semibold">Assente</span>' : `${d.primo} +${d.secondo}`}</span>
          </div>
        `).join('');

        card.innerHTML = `
          <div class="flex justify-between items-center font-bold text-slate-200 border-b border-slate-800 pb-1.5">
            <span class="text-blue-400">👤 ${item.user} <span class="text-[10px] text-slate-500 font-normal">(${item.date})</span></span>
            <button onclick="deleteHistoryItem(${item.id})" class="text-[10px] text-slate-500 hover:text-rose-400 transition">🗑️ Elimina</button>
          </div>
          <div class="space-y-0.5 pt-1">
            ${rows}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function shareWhatsApp() {
      const summaryBox = document.getElementById('summary-text-box');
      if (!summaryBox) return;
      const text = summaryBox.innerText;
      window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank');
    }
  </script>
</body>
</html>
