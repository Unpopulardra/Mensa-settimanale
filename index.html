<!DOCTYPE html>
<html lang="it" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mensa Settimanale</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  
  <!-- Configurazione PWA -->
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mensa">
  
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <link rel="manifest" href="manifest.json">

  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js')
          .then(reg => console.log('SW registrato:', reg))
          .catch(err => console.error('Errore SW:', err));
      });
    }

    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans pb-16">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-50">
    <div class="max-w-2xl mx-auto px-4 py-3 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="p-2 bg-blue-600/20 text-blue-400 rounded-xl border border-blue-500/30">
          🍴
        </div>
        <div>
          <h1 class="font-bold text-slate-100 text-base leading-tight">Mensa Settimanale</h1>
          <p class="text-xs text-slate-400">Elia • Simone • Adrian</p>
        </div>
      </div>
      <div id="sync-status" class="px-2.5 py-1 bg-amber-950/60 text-amber-400 text-[11px] font-semibold rounded-lg border border-amber-800/50 flex items-center gap-1.5">
        <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span> Connessione...
      </div>
    </div>
  </header>

  <main class="max-w-2xl mx-auto px-4 py-6 space-y-6">

    <!-- Passaggio 1: Input Menu -->
    <section class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-4">
      <div class="flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span class="w-6 h-6 rounded-full bg-blue-600/20 text-blue-400 text-xs font-bold flex items-center justify-center border border-blue-500/30">1</span>
          <h2 class="font-bold text-sm text-slate-200">Carica Menu dello Chef</h2>
        </div>
        <button onclick="enableManualEdit()" class="text-xs text-blue-400 hover:text-blue-300 flex items-center gap-1">
          ✏️ Compila Manuale
        </button>
      </div>

      <!-- Tab Selettore Input -->
      <div class="flex bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-medium">
        <button id="tab-text" onclick="switchTab('text')" class="flex-1 py-2 rounded-lg bg-slate-800 text-blue-400 font-bold shadow-sm">Testo Incollato</button>
        <button id="tab-file" onclick="switchTab('file')" class="flex-1 py-2 rounded-lg text-slate-400">PDF / Documenti</button>
      </div>

      <!-- Area Testo -->
      <div id="container-text">
        <textarea id="menu-text" rows="5" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200 focus:outline-none focus:border-blue-500 font-mono" placeholder="Incolla qui il messaggio del menu inviato dallo chef..."></textarea>
      </div>

      <!-- Area File -->
      <div id="container-file" class="hidden">
        <label for="menu-file" class="border-2 border-dashed border-slate-800 hover:border-slate-700 bg-slate-950 rounded-xl p-6 text-center block cursor-pointer">
          <input type="file" id="menu-file" accept=".pdf,text/*" class="hidden" onchange="handleFileUpload(event)">
          <span class="text-2xl block mb-1">📄</span>
          <span id="file-label-text" class="text-xs text-slate-400 block">Tocca per selezionare un file PDF o Testo</span>
        </label>
      </div>

      <button id="btn-process" onclick="parseMenuTextLocal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
        ⚡ Estrai e Sincronizza Menu
      </button>
    </section>

    <!-- Editor Manuale / Anteprima Menu -->
    <section id="section-menu-editor" class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <h3 class="text-xs font-bold text-slate-300 uppercase tracking-wider">📋 Menu della Settimana (Condiviso)</h3>
        <span class="text-[10px] text-slate-500">2 Primi e 2 Secondi</span>
      </div>

      <div id="editor-days-container" class="space-y-4"></div>
    </section>

    <!-- Passaggio 2: Scelte Collega -->
    <section id="section-selection" class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-4">
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded-full bg-blue-600/20 text-blue-400 text-xs font-bold flex items-center justify-center border border-blue-500/30">2</span>
        <h2 class="font-bold text-sm text-slate-200">Seleziona i Piatti per i Colleghi</h2>
      </div>

      <!-- Selettore Persona -->
      <div class="grid grid-cols-3 gap-2 bg-slate-950 p-1 rounded-xl border border-slate-800 text-xs font-semibold">
        <button id="btn-user-Elia" onclick="setActiveUser('Elia')" class="py-2 rounded-lg bg-blue-600 text-white">Elia</button>
        <button id="btn-user-Simone" onclick="setActiveUser('Simone')" class="py-2 rounded-lg text-slate-400">Simone</button>
        <button id="btn-user-Adrian" onclick="setActiveUser('Adrian')" class="py-2 rounded-lg text-slate-400">Adrian</button>
      </div>

      <!-- Form Opzioni Giornaliere con Presenza Giornaliera -->
      <div id="selection-forms-container" class="space-y-4"></div>

      <!-- Pulsanti Salva nello Storico e WhatsApp Personale -->
      <div class="pt-2 grid grid-cols-1 gap-2">
        <button onclick="saveUserToHistory()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2">
          💾 Salva la Settimana di <span id="btn-save-name" class="font-bold underline">Elia</span> nello Storico
        </button>
      </div>
    </section>

    <!-- Passaggio 3: Riepilogo e WhatsApp Chef -->
    <section id="section-summary" class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-4">
      <div class="flex items-center gap-2">
        <span class="w-6 h-6 rounded-full bg-blue-600/20 text-blue-400 text-xs font-bold flex items-center justify-center border border-blue-500/30">3</span>
        <h2 class="font-bold text-sm text-slate-200">Totali da Inviare allo Chef</h2>
      </div>

      <div id="summary-text-box" class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs font-mono whitespace-pre-wrap text-slate-300 leading-relaxed"></div>

      <button onclick="shareWhatsApp()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-3 rounded-xl text-xs transition flex items-center justify-center gap-2">
        💬 Invia Totali allo Chef su WhatsApp
      </button>
    </section>

    <!-- Sezione Storico Ordinazioni -->
    <section id="section-history" class="bg-slate-900 rounded-2xl p-4 border border-slate-800 space-y-4">
      <div class="flex justify-between items-center border-b border-slate-800 pb-3">
        <div class="flex items-center gap-2">
          <span class="text-base">📜</span>
          <h2 class="font-bold text-sm text-slate-200">Storico Ordinazioni (Ultimo Mese)</h2>
        </div>
        <span class="text-[10px] text-slate-500">Max 4 settimane</span>
      </div>

      <div id="history-container" class="space-y-3">
        <p class="text-xs text-slate-500 italic text-center py-2">Nessun ordine nello storico.</p>
      </div>
    </section>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyB0Tj6UNisnUnvkpkVzX2oQLue3Y9liILk",
      authDomain: "mensa-aziendale-961a3.firebaseapp.com",
      projectId: "mensa-aziendale-961a3",
      storageBucket: "mensa-aziendale-961a3.firebasestorage.app",
      messagingSenderId: "941882269951",
      appId: "1:941882269951:web:f623f67d427da6899f6cca",
      databaseURL: "https://mensa-aziendale-961a3-default-rtdb.europe-west1.firebasedatabase.app"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const DAYS = ['Lunedì', 'Martedì', 'Mercoledì', 'Giovedì', 'Venerdì'];
    const USERS = ['Elia', 'Simone', 'Adrian'];

    let activeTab = 'text';
    let activeUser = 'Elia';

    let menuState = {
      'Lunedì': { p1: '', p2: '', s1: '', s2: '' },
      'Martedì': { p1: '', p2: '', s1: '', s2: '' },
      'Mercoledì': { p1: '', p2: '', s1: '', s2: '' },
      'Giovedì': { p1: '', p2: '', s1: '', s2: '' },
      'Venerdì': { p1: '', p2: '', s1: '', s2: '' }
    };

    let userSelections = {
      Elia: { presence: { Lunedì: true, Martedì: true, Mercoledì: true, Giovedì: true, Venerdì: true }, choices: {} },
      Simone: { presence: { Lunedì: true, Martedì: true, Mercoledì: true, Giovedì: true, Venerdì: true }, choices: {} },
      Adrian: { presence: { Lunedì: true, Martedì: true, Mercoledì: true, Giovedì: true, Venerdì: true }, choices: {} }
    };

    let historyData = [];

    DAYS.forEach(d => {
      USERS.forEach(u => {
        userSelections[u].choices[d] = { primo: '', secondo: '' };
      });
    });

    window.onload = () => {
      initFirebaseSync();
    };

    function initFirebaseSync() {
      const statusEl = document.getElementById('sync-status');
      
      db.ref('mensa_data').on('value', snapshot => {
        const data = snapshot.val();
        if (data) {
          if (data.menuState) menuState = data.menuState;
          if (data.userSelections) {
            // Migrazione retrocompatibile per la presenza giornaliera
            USERS.forEach(u => {
              if (data.userSelections[u]) {
                if (!data.userSelections[u].presence) {
                  const oldActive = data.userSelections[u].active !== false;
                  data.userSelections[u].presence = { Lunedì: oldActive, Martedì: oldActive, Mercoledì: oldActive, Giovedì: oldActive, Venerdì: oldActive };
                }
                userSelections[u] = data.userSelections[u];
              }
            });
          }
          if (data.historyData) historyData = data.historyData;
          
          renderEditor();
          renderSelections();
          updateSummaryUIOnly();
          renderHistory();
        }

        statusEl.className = 'px-2.5 py-1 bg-emerald-950/
